<script>
if('scrollRestoration' in history)history.scrollRestoration='manual';scrollTo(0,0);
const $=s=>document.querySelector(s);
/* =====================================================================
EDIT ME — this is the only part of the code you need to touch

const BASE='';

   Every tile on the landing page shows its number (01 to 13).
   To fill a tile, put its clip (.mp4) or photo (.jpg / .png / .webp)
   between the quotes next to that number. Leave "" to keep the numbered placeholder. */
const LANDING={
   1: "https://pub-8366b99a257d4184a0d83115fda7334f.r2.dev/videos/Sound-02.mp4",
   2: "https://pub-8366b99a257d4184a0d83115fda7334f.r2.dev/videos/Eden-01.mp4",
   3: "https://pub-8366b99a257d4184a0d83115fda7334f.r2.dev/videos/Sound-01.mp4",
   4: "https://pub-8366b99a257d4184a0d83115fda7334f.r2.dev/videos/Burial-02.mp4",
   5: "https://pub-8366b99a257d4184a0d83115fda7334f.r2.dev/videos/Bond-01.mp4",
   6: "https://pub-8366b99a257d4184a0d83115fda7334f.r2.dev/videos/Experimental-03.mp4",
   7: "https://pub-8366b99a257d4184a0d83115fda7334f.r2.dev/videos/Carnival-02.mp4",
   8: "https://pub-8366b99a257d4184a0d83115fda7334f.r2.dev/videos/Experimental-04.mp4",
   9: "https://pub-8366b99a257d4184a0d83115fda7334f.r2.dev/videos/Burial-01.mp4",
  10: "https://pub-8366b99a257d4184a0d83115fda7334f.r2.dev/videos/Experimental-01.mp4",
  11: "https://pub-8366b99a257d4184a0d83115fda7334f.r2.dev/videos/Eden-02.mp4",
  12: "https://pub-8366b99a257d4184a0d83115fda7334f.r2.dev/videos/Carnival-01.mp4",
  13: "https://pub-8366b99a257d4184a0d83115fda7334f.r2.dev/videos/Manchester-02.mp4"
};

/* ---------- 2. THE ARCHIVE ----------
   Each section below is one folder tab. Nothing is filled in yet.
   To add a project: copy the COPY ME line, paste it inside the [ ] of the section
   you want (remove the // at the start), and fill in the two parts:
        name = the project name shown in the list
        clip = the link (or filename) of the short looping preview clip (.mp4)
   Make sure every project line ends with a comma.

   OPTIONAL extras — add any of these inside the { } if you want them:
        year:"2026"                 shows a date on the right of the list
        poster:"photo.jpg"          image shown while the clip loads
        page:"https://..."          makes the project clickable (arrow) and opens this link
        embed:"https://player.vimeo.com/video/123456"
                                    makes it clickable and opens a project page with this video
        video:"full.mp4"            same, using your own video file instead
        stills:["a.jpg","b.jpg"]    photos on that project page
   You can rename the section names (Cinematography, Music, ...) freely. */
const ARCHIVE={

 "Cinematography":[
   { name:"Bond Student Film", clip:"https://pub-8366b99a257d4184a0d83115fda7334f.r2.dev/videos/Bond-01.mp4", year:"2025"},
   { name:"Experimental Fashion Film", clip:"https://pub-8366b99a257d4184a0d83115fda7334f.r2.dev/videos/Experimental-01.mp4", year:"2025"},
   { name:"Edenhxya Music Video", clip:"https://pub-8366b99a257d4184a0d83115fda7334f.r2.dev/videos/Eden-01.mp4", year:"2026"},
  // COPY ME →  { name:"Project name", clip:"link-to-looping-clip.mp4" },
 ],

 "Music":[
   { name:"Edednhxya Music Video", clip:"https://pub-8366b99a257d4184a0d83115fda7334f.r2.dev/videos/Eden-01.mp4", year:"2026"},
   { name:"Manchester Carnival", clip:"https://pub-8366b99a257d4184a0d83115fda7334f.r2.dev/videos/Carnival-02.mp4", year:"2026"},
   { name:"Drummer", clip:"https://pub-8366b99a257d4184a0d83115fda7334f.r2.dev/videos/Drummer-01.mp4", year:"2024"},
   { name:"Manchester", clip:"https://pub-8366b99a257d4184a0d83115fda7334f.r2.dev/videos/Manchester-02.mp4", year:"2025"},

  // COPY ME →  { name:"Project name", clip:"link-to-looping-clip.mp4" },
 ],

 "Social Media":[
  // COPY ME →  { name:"Project name", clip:"link-to-looping-clip.mp4" },
 ],

 "Post Production":[
  // COPY ME →  { name:"Project name", clip:"link-to-looping-clip.mp4" },
 ]

};
/* ===================== END OF EDIT ME ===================== */

const U=f=>!f?'':/^(https?:)?\/\//.test(f)?f:BASE+f;
const DATA={};
Object.entries(ARCHIVE).forEach(([c,l])=>{DATA[c]=l.map(p=>[p.name||'untitled',p.type||'',p.year||'',(p.page||p.embed||p.video||p.stills)?1:0,{preview:p.clip,poster:p.poster,video:p.video,embed:p.embed,stills:p.stills,page:p.page}])});
const hue=(s)=>[...s].reduce((a,c)=>a*31+c.charCodeAt(0),7)%360;
const art=(n,a=0)=>{const h=hue(n);return `radial-gradient(circle at ${30+a*20}% ${40+a*10}%,hsl(${h} 80% 55%),transparent 55%),radial-gradient(circle at ${75-a*15}% 70%,hsl(${(h+70)%360} 70% 35%),transparent 60%),linear-gradient(${120+a*40}deg,#050505,hsl(${h} 30% 12%))`};
const cab=$('#cab');let n=0,tick;
Object.entries(DATA).forEach(([cat,items],i)=>{
const d=document.createElement('div');d.className='drawer'+(i===Object.keys(DATA).length-1?' last':'');
d.innerHTML=`<div class="tabrow"><button class="tab" style="--i:${i}"><span class="n">0${i+1}</span>${cat}</button></div>
<div class="face"><div class="body"><div class="in"><div><ul class="list"></ul></div>
<div class="pv"><div class="art"></div><div class="t"></div></div></div></div></div>`;
const ul=d.querySelector('.list'),pv=d.querySelector('.pv');
if(!items.length){ul.innerHTML='<li><span></span><span>no projects yet</span><span></span></li>';pv.querySelector('.t').textContent='add a project in the code'}
items.forEach((it,k)=>{
const li=document.createElement('li');li.className=it[3]?'go':'no';li.dataset.k=k;
li.innerHTML=`<span class="i">${String(k+1).padStart(2,'0')}</span><span>${it[0]}${it[3]?'<span class="ar">↗</span>':''}</span><span class="y">${it[2]}</span>`;
li.onmouseenter=()=>show(li,it,pv,ul);
li.onclick=()=>it[3]&&(it[4]&&it[4].page?window.open(it[4].page,'_blank'):openPage(cat,it));
ul.appendChild(li);
});
d.querySelector('.tab').onclick=()=>{
const was=d.classList.contains('open');
document.querySelectorAll('.drawer').forEach(x=>x.classList.remove('open'));
cab.classList.toggle('has-open',!was);requestAnimationFrame(layout);
if(!was){d.classList.add('open');items.forEach(x=>x[4]&&x[4].preview&&vid(pv,x[4]));const f=ul.querySelector('li[data-k]');if(f)show(f,items[+f.dataset.k],pv,ul)}
};
cab.appendChild(d);
});
function layout(){const D=[...document.querySelectorAll('.drawer')],lo=D[D.length-1].classList.contains('open');
 const H=Math.max(150,cab.clientHeight-128-(lo?3:36)-58);cab.style.setProperty("--H",H+"px");
 D.forEach((x,i)=>x.querySelector('.face').style.height=x.classList.contains('open')?H+'px':(i==D.length-1?'34px':'0px'))}
addEventListener('resize',layout);
const arch=document.createElement('div');arch.className='arch';
arch.innerHTML='<div>the archive<small>Selected works</small></div>';cab.appendChild(arch);
function vid(pv,m){pv._v=pv._v||{};let v=pv._v[m.preview];if(!v){v=pv._v[m.preview]=document.createElement('video');v.muted=v.loop=v.playsInline=true;v.preload='auto';v.poster=U(m.poster);v.src=U(m.preview);v.style.cssText='position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0';pv.querySelector('.art').after(v)}return v}
function show(li,it,pv,ul){
ul.querySelectorAll('li').forEach(x=>x.classList.remove('sel'));li.classList.add('sel');
/* PROTOTYPE: swap the gradient for a <video src="..." autoplay muted loop> here */
{const m=it[4]||{},bg=pv.querySelector('.art');
  pv.querySelectorAll('video').forEach(x=>{x.style.opacity=0;x.pause()});
  if(m.preview){bg.style.background='#000';const v=vid(pv,m);pv._cur=m.preview;
   if(m.poster)v.style.opacity=1;
   const go=()=>{if(pv._cur===m.preview){v.style.opacity=1;v.currentTime=0;v.play().catch(()=>{})}};
   v.readyState>=2?go():v.addEventListener('loadeddata',go,{once:true})}
  else{pv._cur='';bg.style.background=art(it[0])}}
}

 if(m.embed)return `<div class="ph"><iframe src="${m.embed}" allow="autoplay;fullscreen;picture-in-picture" allowfullscreen></iframe></div>`;

 return m.stills?m.stills.map(f=>`<div class="ph"><img src="${U(f)}" loading="lazy" alt=""></div>`).join(''):[1,2,3].map(a=>`<div class="ph"><div class="art" style="background:${art(it[0],a)}"></div><div class="t">STILL 0${a}</div></div>`).join('')}

/* mobile: make sure landing clips start (set muted/inline in JS, retry on first touch) */
{const tv=[...document.querySelectorAll('#collage video')];
 const kick=()=>tv.forEach(v=>{if(v.paused)v.play().catch(()=>{})});
 tv.forEach(v=>{v.muted=true;v.defaultMuted=true;v.setAttribute('muted','');v.playsInline=true;v.setAttribute('playsinline','');v.loop=true;v.addEventListener('canplay',()=>v.play().catch(()=>{}),{once:true})});
 kick();['touchstart','scroll','click'].forEach(e=>addEventListener(e,kick,{passive:true,once:true}));

const h1=$('#hero h1'),hero=$('#hero'),nz=$('#noise'),fs=$('#fs');
let nzOn=false;
let Hfs=0,dist=0,SD=1,tyT=0,tyC=0,tyL=null;

function ramp(){tyC+=(tyT-tyC)*.14;if(Math.abs(tyT-tyC)<.05)tyC=tyT;if(tyC!==tyL){fs.style.transform=`translateY(${tyC}px)`;tyL=tyC}requestAnimationFrame(ramp)}
ramp();
function update(){
const vh=innerHeight,p=Math.min(1,scrollY/(vh*.7));
h1.style.setProperty('--s',(-20+Math.min(1,p/.3)*140)+'%');
const o=Math.max(0,1-Math.abs(p-.6)/.4);
nz.style.opacity=Math.min(1,o*1.3);nzOn=o>0;
hero.classList.toggle('gone',p>.6);

fs.classList.toggle('live',p>.9);{const t=Math.min(1,Math.max(0,(scrollY-vh*.95)/SD));tyT=-(t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2)*dist}
}
addEventListener('scroll',update,{passive:true});addEventListener('resize',()=>{sizeDoc();update()});sizeDoc();update();document.fonts&&document.fonts.ready.then(()=>{sizeDoc();update()});
const nctx=nz.getContext('2d'),S=2;let nimg,nbuf,last=0;
function sizeNz(){nz.width=Math.ceil(innerWidth/S);nz.height=Math.ceil(innerHeight/S);nimg=nctx.createImageData(nz.width,nz.height);nbuf=new Uint32Array(nimg.data.buffer)}

sizeNz();addEventListener('resize',sizeNz);requestAnimationFrame(loop);

{const boot=$('#boot'),T0=performance.now(),MIN=1800,MAX=20000;
 boot.innerHTML='<div id="bl"></div>';const bl=$('#bl');
 const add=h=>{const d=document.createElement('div');d.innerHTML=h||'&nbsp;';bl.appendChild(d);return d};
 [['aidans.archive [version 1.0.0]',0],['(c) aidans.archive. all rights reserved.',160],['',300]].forEach(([t,ms])=>setTimeout(()=>add(t),ms));
 const vids=[...document.querySelectorAll('#collage video')],imgs=[...document.querySelectorAll('#collage img')];
 const pv=v=>{if(v.error||v.readyState>=4)return 1;const d=v.duration;return d&&isFinite(d)&&v.buffered.length?Math.min(1,v.buffered.end(v.buffered.length-1)/d):0};
 let fontsOk=!document.fonts;document.fonts&&document.fonts.ready.then(()=>fontsOk=true);
 const total=()=>{const a=[...vids.map(pv),...imgs.map(i=>i.complete?1:0),fontsOk?1:0];return a.reduce((x,y)=>x+y,0)/a.length};
 let bar,eta,shown=0,t1=0,done=false;
 function start(){t1=performance.now();add('loading landing page...');
  add('<span id="bar"></span>');
  eta=add('estimating time remaining...');bar=$('#bar');requestAnimationFrame(frame)}
 function frame(){const now=performance.now();let p=now-T0>MAX?1:total();
  shown+=(p-shown)*.12;if(p>=1&&shown>.995)shown=1;
  {const n=Math.round(shown*30),pct=String(Math.floor(shown*100)).padStart(3,' ');bar.textContent='['+'#'.repeat(n)+'.'.repeat(30-n)+'] '+pct+'%'}
  if(shown<1){const rate=shown/Math.max(.5,(now-t1)/1000);eta.textContent=shown>.05&&rate>0?'estimated time remaining: '+Math.max(1,Math.ceil((1-shown)/rate))+'s':'estimating time remaining...'}
  else eta.textContent='done.';
  if(shown>=1&&now-T0>MIN&&!done){done=true;setTimeout(()=>{boot.classList.add('out');document.body.classList.remove('booting');setTimeout(()=>boot.remove(),500)},350);return}
  requestAnimationFrame(frame)}
 setTimeout(()=>{const pr='C:\\aidans.archive>',cmd='load landing.exe',row=add(pr+'<span id="ty"></span><span class="cur">_</span>');let i=0;
  const ty=setInterval(()=>{$('#ty').textContent=cmd.slice(0,++i);if(i>=cmd.length){clearInterval(ty);setTimeout(()=>{row.querySelector('.cur').remove();start()},250)}},45)},450)}
